name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: odumak
          POSTGRES_PASSWORD: odumak
          POSTGRES_DB: odumak
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odumak" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://odumak:odumak@localhost:5432/odumak
      JWT_SECRET_KEY: ci-secret
      ENABLE_EMBEDDING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: pytest -q
